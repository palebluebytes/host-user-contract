# Multi-language formatting for the contract, run via `nix fmt` (treefmt over nixpkgs tools — no extra
# flake inputs, ADR-0002). Nix is the deliverable; the Python/shell formatters stand ready for any
# example or host-side code a future addition brings.

[formatter.nix]
command = "nixfmt"
includes = ["*.nix"]

[formatter.python]
command = "ruff"
options = ["format"]
includes = ["*.py"]

[formatter.shell]
command = "shfmt"
options = ["--write", "--indent", "2", "--case-indent", "--simplify"]
includes = ["*.sh", "*.bash"]
